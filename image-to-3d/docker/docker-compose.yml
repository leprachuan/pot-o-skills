version: "3.8"

services:
  image-to-3d:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: image-to-3d-server
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "18795:18795"
    volumes:
      - ../models:/app/models
      - /tmp/3d-output:/app/output
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - IMG3D_SERVER_HOST=0.0.0.0
      - IMG3D_SERVER_PORT=18795
      - IMG3D_MODEL_CACHE=/app/models
      - IMG3D_OUTPUT_DIR=/app/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import requests; r=requests.get('http://localhost:18795/health'); exit(0 if r.ok else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
