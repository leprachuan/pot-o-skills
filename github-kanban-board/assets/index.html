<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wee Todo Kanban</title>
    <style>
        :root {
            --accent: #3ecf8e;
            --accent-hover: #34b87d;
            --accent-glow: rgba(62, 207, 142, 0.35);
            --gold: #f5c542;
            --gold-hover: #e0b23a;
            --danger: #ff5f6d;
            --danger-hover: #e04a58;
            --text-primary: rgba(255, 255, 255, 0.92);
            --text-secondary: rgba(255, 255, 255, 0.55);
            --text-muted: rgba(255, 255, 255, 0.35);
            --glass-bg: rgba(255, 255, 255, 0.06);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.4),
                            inset 0 1px 0 rgba(255, 255, 255, 0.08);
            --glass-blur: blur(24px) saturate(180%);
            --surface-raised: rgba(255, 255, 255, 0.08);
            --surface-sunken: rgba(0, 0, 0, 0.2);
            --surface-overlay: rgba(0, 0, 0, 0.6);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-xs: 6px;
            --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
            --font-mono: "SF Mono", "Fira Code", "Cascadia Code", monospace;
            --transition: 0.15s ease;
            --transition-slow: 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0e1a;
            color: var(--text-primary);
            font-family: var(--font);
            min-height: 100vh;
            overflow-x: hidden;
        }

        .bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            pointer-events: none;
            z-index: 0;
        }

        .bg-blob-1 {
            width: 600px;
            height: 600px;
            top: -10%;
            left: -5%;
            background: radial-gradient(circle, #0d4a2a 0%, transparent 70%);
        }

        .bg-blob-2 {
            width: 500px;
            height: 500px;
            top: 50%;
            right: -10%;
            background: radial-gradient(circle, #1a3d5a 0%, transparent 70%);
        }

        .bg-blob-3 {
            width: 400px;
            height: 400px;
            bottom: -5%;
            left: 10%;
            background: radial-gradient(circle, #2a1a3d 0%, transparent 70%);
        }

        header {
            position: relative;
            z-index: 10;
            padding: 24px 32px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border-bottom: 1px solid var(--glass-border);
            box-shadow: var(--glass-shadow);
            margin-bottom: 24px;
        }

        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 24px;
            font-weight: 600;
        }

        .logo {
            font-size: 28px;
        }

        .header-controls {
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .filter-group {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .filter-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .quick-filters {
            display: flex;
            gap: 8px;
        }

        .quick-filter-btn {
            background: rgba(62, 207, 142, 0.15);
            border: 1px solid rgba(62, 207, 142, 0.3);
            color: var(--accent);
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            white-space: nowrap;
        }

        .quick-filter-btn:hover {
            background: rgba(62, 207, 142, 0.25);
            border-color: var(--accent);
        }

        .quick-filter-btn.active {
            background: rgba(62, 207, 142, 0.35);
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(62, 207, 142, 0.3);
        }

        select {
            background: var(--surface-raised);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        select:hover {
            background: var(--surface-raised);
            border-color: var(--accent);
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .status-badge {
            background: var(--gold);
            color: #0a0e1a;
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            font-weight: 600;
        }

        .container {
            position: relative;
            z-index: 5;
            max-width: 100%;
            margin: 0 auto;
            padding: 0 32px 32px;
        }

        .kanban {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 24px;
            min-height: 70vh;
        }

        .column {
            display: flex;
            flex-direction: column;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow);
            overflow: hidden;
        }

        .column-header {
            padding: 16px;
            background: var(--surface-raised);
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 16px;
        }

        .column-header.todo {
            color: var(--text-secondary);
        }

        .column-header.in-progress {
            color: var(--gold);
        }

        .column-header.ai-active {
            color: #9d4edd;
        }

        .column-header.pending-review {
            color: #ff006e;
        }

        .column-header.done {
            color: var(--accent);
        }

        .column-count {
            background: var(--surface-sunken);
            color: var(--text-muted);
            padding: 2px 8px;
            border-radius: var(--radius-xs);
            font-size: 12px;
            font-weight: 500;
        }

        .column-body {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card {
            background: var(--surface-raised);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            cursor: move;
            transition: var(--transition);
            position: relative;
        }

        .card:hover {
            background: var(--glass-bg);
            border-color: var(--accent);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3),
                       inset 0 0 0 1px var(--accent-glow);
        }

        .card-title {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 8px;
            line-height: 1.4;
        }

        .card-meta {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background: var(--surface-sunken);
            color: var(--text-secondary);
            padding: 4px 8px;
            border-radius: var(--radius-xs);
            font-size: 11px;
            font-weight: 500;
        }

        .badge.agent {
            background: rgba(62, 207, 142, 0.15);
            color: var(--accent);
            border: 1px solid rgba(62, 207, 142, 0.3);
        }

        .badge.due-soon {
            background: rgba(245, 197, 66, 0.15);
            color: var(--gold);
            border: 1px solid rgba(245, 197, 66, 0.3);
        }

        .badge.overdue {
            background: rgba(255, 95, 109, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 95, 109, 0.3);
        }

        .badge.priority-high {
            background: rgba(255, 95, 109, 0.15);
            color: var(--danger);
            border: 1px solid rgba(255, 95, 109, 0.3);
        }

        .badge.urgency-urgent {
            background: rgba(255, 95, 109, 0.3);
            color: #ff3a47;
            border: 1px solid rgba(255, 95, 109, 0.6);
            font-weight: 700;
            animation: pulse-urgent 2s ease-in-out infinite;
        }

        @keyframes pulse-urgent {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        input[type="date"] {
            background: var(--surface-raised);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
        }

        input[type="date"]:hover {
            background: var(--surface-raised);
            border-color: var(--accent);
        }

        input[type="date"]:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-muted);
        }

        .card-link {
            color: var(--accent);
            text-decoration: none;
            transition: var(--transition);
        }

        .card-link:hover {
            color: var(--accent-hover);
            text-decoration: underline;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            text-align: center;
            color: var(--text-muted);
            min-height: 200px;
        }

        .empty-state-icon {
            font-size: 32px;
            margin-bottom: 8px;
            opacity: 0.5;
        }

        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 60vh;
            font-size: 16px;
            color: var(--text-secondary);
        }

        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .error {
            background: rgba(255, 95, 109, 0.1);
            border: 1px solid rgba(255, 95, 109, 0.3);
            color: var(--danger);
            padding: 16px;
            border-radius: var(--radius-sm);
            margin-bottom: 16px;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(62, 207, 142, 0.3);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(62, 207, 142, 0.5);
        }

        /* Issue Details Drawer */
        .issue-drawer {
            position: fixed;
            top: 0;
            right: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
        }

        .issue-drawer.open {
            pointer-events: auto;
        }

        .drawer-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            transition: background 0.3s ease;
            pointer-events: none;
        }

        .issue-drawer.open .drawer-overlay {
            background: rgba(0, 0, 0, 0.5);
            pointer-events: auto;
        }

        .drawer-panel {
            position: fixed;
            top: 0;
            right: 0;
            width: 50vw;
            height: 100vh;
            background: var(--glass-bg);
            border-left: 1px solid var(--glass-border);
            backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow);
            display: flex;
            flex-direction: column;
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 101;
        }

        .issue-drawer.open .drawer-panel {
            transform: translateX(0);
        }

        .drawer-header {
            padding: 20px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .drawer-issue-title {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            flex: 1;
            line-height: 1.4;
        }

        .drawer-close {
            background: var(--surface-raised);
            border: 1px solid var(--glass-border);
            color: var(--text-primary);
            border-radius: var(--radius-sm);
            padding: 8px 12px;
            cursor: pointer;
            font-size: 18px;
            transition: var(--transition);
            flex-shrink: 0;
        }

        .drawer-close:hover {
            background: var(--glass-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .drawer-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-height: 0;
        }

        .drawer-footer {
            border-top: 1px solid var(--glass-border);
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-shrink: 0;
            background: var(--surface-raised);
        }

        .comment-input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .comment-input {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 13px;
            resize: none;
            height: 60px;
            transition: var(--transition);
        }

        .comment-input::placeholder {
            color: var(--text-muted);
        }

        .comment-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .action-buttons {
            display: flex;
            gap: 8px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            border: 1px solid var(--glass-border);
            background: var(--surface-raised);
            color: var(--text-primary);
            font-family: var(--font);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn:hover {
            background: var(--glass-bg);
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn-dispatch {
            flex: 1.5;
            background: rgba(62, 207, 142, 0.15);
            border-color: rgba(62, 207, 142, 0.3);
            color: var(--accent);
        }

        .btn-dispatch:hover {
            background: rgba(62, 207, 142, 0.25);
            border-color: var(--accent);
        }

        .dispatch-group {
            display: flex;
            gap: 8px;
        }

        .dispatch-select {
            flex: 1;
            background: var(--surface-raised);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            color: var(--text-primary);
            padding: 8px 12px;
            font-family: var(--font);
            font-size: 13px;
            cursor: pointer;
            transition: var(--transition);
        }

        .dispatch-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .issue-meta {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .meta-row {
            display: flex;
            gap: 12px;
            font-size: 13px;
        }

        .meta-label {
            color: var(--text-secondary);
            font-weight: 500;
            min-width: 80px;
        }

        .meta-value {
            color: var(--text-primary);
            flex: 1;
            word-break: break-word;
        }

        .divider {
            height: 1px;
            background: var(--glass-border);
            margin: 8px 0;
        }

        .issue-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .issue-body h3,
        .issue-comments h3 {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
            margin: 0;
        }

        .body-text {
            font-size: 13px;
            color: var(--text-secondary);
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .issue-comments {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .comment {
            background: var(--surface-raised);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 12px;
            display: flex;
            gap: 8px;
        }

        .comment-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--surface-sunken);
            flex-shrink: 0;
            overflow: hidden;
        }

        .comment-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .comment-body {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .comment-author {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .comment-date {
            font-size: 11px;
            color: var(--text-muted);
        }

        .comment-text {
            font-size: 12px;
            color: var(--text-secondary);
            line-height: 1.5;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .no-comments {
            font-size: 13px;
            color: var(--text-muted);
            font-style: italic;
            padding: 8px;
            text-align: center;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .drawer-panel {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="bg-blob bg-blob-1"></div>
    <div class="bg-blob bg-blob-2"></div>
    <div class="bg-blob bg-blob-3"></div>

    <header>
        <div class="header-content" style="flex-direction: column; align-items: stretch; gap: 16px;">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h1>
                    <span class="logo">🍀</span>
                    Wee Todo Kanban
                </h1>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div class="status-badge" id="sync-status">🔄 Loading...</div>
                    <button id="refresh-btn" title="Refresh now" style="padding: 6px 10px; background: var(--accent); color: white; border: none; border-radius: var(--radius-xs); cursor: pointer; font-size: 13px; font-weight: 500; transition: var(--transition); white-space: nowrap;">🔄 Refresh</button>
                    <div id="refresh-timer" style="font-size: 12px; color: var(--text-muted); min-width: 64px; text-align: right;">Auto in 60s</div>
                </div>
            </div>

            <div class="header-controls" style="flex-wrap: wrap; row-gap: 12px;">
                <div class="filter-group" style="flex: 1; min-width: 220px; max-width: 320px;">
                    <label class="filter-label">Search:</label>
                    <input type="text" id="search-input" placeholder="Search issues..." style="flex: 1; padding: 6px 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: var(--radius-xs); color: var(--text-primary); font-size: 13px;">
                </div>

                <div class="filter-group">
                    <label class="filter-label">Urgency:</label>
                    <select id="urgency-filter">
                        <option value="">All</option>
                        <option value="urgent">Urgent</option>
                        <option value="normal">Normal</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label class="filter-label">Due:</label>
                    <input type="date" id="date-from-filter" title="Due from">
                    <span style="color: var(--text-muted);">→</span>
                    <input type="date" id="date-to-filter" title="Due to">
                </div>

                <div class="quick-filters">
                    <button class="quick-filter-btn" id="due-today-btn">📅 Today</button>
                    <button class="quick-filter-btn" id="due-week-btn">📆 This Week</button>
                </div>

                <div style="display: flex; gap: 8px; align-items: center; margin-left: auto;">
                    <button id="clear-filters-btn" style="padding: 6px 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-secondary); border-radius: var(--radius-xs); cursor: pointer; font-size: 12px; font-weight: 500; transition: var(--transition); white-space: nowrap;">✕ Clear Filters</button>
                    <button id="toggle-done-btn" style="padding: 6px 10px; background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-secondary); border-radius: var(--radius-xs); cursor: pointer; font-size: 12px; font-weight: 500; transition: var(--transition); white-space: nowrap;">👁️ Hide Done</button>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="error-container"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <span>Loading kanban board...</span>
        </div>
        <div id="kanban" class="kanban" style="display: none;">
            <div class="column todo">
                <div class="column-header todo">
                    <span>📝 To Do</span>
                    <span class="column-count" id="count-todo">0</span>
                </div>
                <div class="column-body" id="column-todo"></div>
            </div>
            <div class="column in-progress">
                <div class="column-header in-progress">
                    <span>🔄 In Progress</span>
                    <span class="column-count" id="count-in-progress">0</span>
                </div>
                <div class="column-body" id="column-in-progress"></div>
            </div>
            <div class="column ai-active">
                <div class="column-header ai-active">
                    <span>🤖 AI Active</span>
                    <span class="column-count" id="count-ai-active">0</span>
                </div>
                <div class="column-body" id="column-ai-active"></div>
            </div>
            <div class="column pending-review">
                <div class="column-header pending-review">
                    <span>👀 Pending Review</span>
                    <span class="column-count" id="count-pending-review">0</span>
                </div>
                <div class="column-body" id="column-pending-review"></div>
            </div>
            <div class="column done">
                <div class="column-header done">
                    <span>✅ Done</span>
                    <span class="column-count" id="count-done">0</span>
                </div>
                <div class="column-body" id="column-done"></div>
            </div>
        </div>

        <!-- Issue Details Drawer Panel -->
        <div id="issue-drawer" class="issue-drawer">
            <div class="drawer-overlay" id="drawer-overlay"></div>
            <div class="drawer-panel">
                <div class="drawer-header">
                    <h2 id="drawer-title" class="drawer-issue-title"></h2>
                    <button class="drawer-close" id="drawer-close">✕</button>
                </div>
                <div class="drawer-content">
                    <div class="issue-meta">
                        <div class="meta-row">
                            <span class="meta-label">Issue:</span>
                            <span class="meta-value" id="drawer-issue-number"></span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Status:</span>
                            <span class="meta-value" id="drawer-status"></span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Agent:</span>
                            <select id="drawer-agent-select" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 4px 8px; border-radius: var(--radius-xs); font-size: 12px; cursor: pointer;">
                                <option value="">- None -</option>
                            </select>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Due Date:</span>
                            <input type="date" id="drawer-due-input" style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 4px 8px; border-radius: var(--radius-xs); font-size: 12px; cursor: pointer;">
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Labels:</span>
                            <select id="drawer-labels-select" multiple style="background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--text-primary); padding: 4px 8px; border-radius: var(--radius-xs); font-size: 12px; cursor: pointer; min-height: 70px;">
                            </select>
                        </div>
                        <div class="meta-row">
                            <span class="meta-label">Priority:</span>
                            <span class="meta-value" id="drawer-priority">-</span>
                        </div>
                    </div>

                    <div class="divider"></div>

                    <div class="issue-body">
                        <h3>Description</h3>
                        <div id="drawer-body" class="body-text"></div>
                    </div>

                    <div class="divider"></div>

                    <div class="issue-comments">
                        <h3>Comments (<span id="comment-count">0</span>)</h3>
                        <div id="comments-list" class="comments-list"></div>
                    </div>
                </div>

                <div class="drawer-footer">
                    <div class="comment-input-group">
                        <textarea class="comment-input" id="comment-textarea" placeholder="Add a comment..."></textarea>
                        <button class="btn" id="post-comment-btn">Post Comment</button>
                    </div>

                    <div class="divider"></div>

                    <div class="dispatch-group">
                        <select class="dispatch-select" id="dispatch-agent">
                            <option value="">Select Agent...</option>
                        </select>
                        <button class="btn btn-dispatch" id="dispatch-btn">Dispatch</button>
                    </div>

                    <div class="divider"></div>

                    <button id="close-issue-btn" style="width: 100%; padding: 10px; background: rgba(255, 95, 109, 0.15); border: 1px solid var(--danger); color: var(--danger); border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; font-size: 14px; transition: var(--transition);">✕ Close Issue</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = window.location.origin;
        let allIssues = [];
        let filteredIssues = [];

        async function loadIssues() {
            try {
                // Build query parameters from filters
                const params = new URLSearchParams();
                const urgencyFilter = document.getElementById('urgency-filter').value;
                const dateFromFilter = document.getElementById('date-from-filter').value;
                const dateToFilter = document.getElementById('date-to-filter').value;

                if (urgencyFilter) params.append('urgency', urgencyFilter);
                if (dateFromFilter) params.append('date_from', dateFromFilter);
                if (dateToFilter) params.append('date_to', dateToFilter);

                const url = `${API_BASE}/api/issues${params.toString() ? '?' + params : ''}`;
                const response = await fetch(url);
                const data = await response.json();

                if (!data.success) {
                    showError(data.error || 'Failed to load issues');
                    return;
                }

                allIssues = [];
                Object.values(data.columns).forEach(col => {
                    allIssues.push(...col);
                });

                renderBoard();
                updateSyncStatus(data.filters_applied ? '🔍 Filtered' : '✅ Ready');
            } catch (error) {
                showError(`Error loading issues: ${error.message}`);
                updateSyncStatus('❌ Error');
            }
        }

        function filterIssues() {
            // Filters are now applied server-side via API
            filteredIssues = allIssues;

            // Apply client-side search filter
            const searchTerm = document.getElementById('search-input').value.toLowerCase();
            if (searchTerm) {
                filteredIssues = filteredIssues.filter(issue => {
                    const titleMatch = issue.title.toLowerCase().includes(searchTerm);
                    const bodyMatch = issue.body && issue.body.toLowerCase().includes(searchTerm);
                    const idMatch = issue.id.toString().includes(searchTerm);
                    return titleMatch || bodyMatch || idMatch;
                });
            }
        }

        function renderBoard() {
            filterIssues();

            const columns = {
                'todo': document.getElementById('column-todo'),
                'in-progress': document.getElementById('column-in-progress'),
                'ai-active': document.getElementById('column-ai-active'),
                'pending-review': document.getElementById('column-pending-review'),
                'done': document.getElementById('column-done')
            };

            // Clear columns
            Object.values(columns).forEach(col => col.innerHTML = '');

            // Group by status
            const grouped = {
                'todo': [],
                'in-progress': [],
                'ai-active': [],
                'pending-review': [],
                'done': []
            };

            filteredIssues.forEach(issue => {
                const status = issue.status || 'todo';
                if (grouped[status]) {
                    grouped[status].push(issue);
                }
            });

            // Render cards
            Object.entries(grouped).forEach(([status, issues]) => {
                const column = columns[status];
                document.getElementById(`count-${status}`).textContent = issues.length;

                if (issues.length === 0) {
                    column.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">✨</div>
                            <div>No issues</div>
                        </div>
                    `;
                } else {
                    issues.forEach(issue => {
                        column.appendChild(createCard(issue));
                    });
                }
            });

            // Show kanban, hide loading
            document.getElementById('loading').style.display = 'none';
            document.getElementById('kanban').style.display = 'grid';
        }

        const LABEL_COLOR_PALETTE = [
            { bg: 'rgba(62, 207, 142, 0.25)', border: '#3ecf8e', text: '#3ecf8e' },      // Emerald
            { bg: 'rgba(245, 197, 66, 0.25)', border: '#f5c542', text: '#f5c542' },      // Gold
            { bg: 'rgba(255, 95, 109, 0.25)', border: '#ff5f6d', text: '#ff5f6d' },      // Red
            { bg: 'rgba(88, 166, 255, 0.25)', border: '#58a6ff', text: '#58a6ff' },      // Blue
            { bg: 'rgba(200, 124, 255, 0.25)', border: '#c87cff', text: '#c87cff' },    // Purple
            { bg: 'rgba(255, 159, 64, 0.25)', border: '#ff9f40', text: '#ff9f40' },      // Orange
            { bg: 'rgba(76, 194, 216, 0.25)', border: '#4cc2d8', text: '#4cc2d8' },      // Cyan
            { bg: 'rgba(255, 107, 107, 0.25)', border: '#ff6b6b', text: '#ff6b6b' },    // Coral
            { bg: 'rgba(165, 142, 251, 0.25)', border: '#a58efb', text: '#a58efb' },    // Light Purple
            { bg: 'rgba(72, 220, 161, 0.25)', border: '#48dca1', text: '#48dca1' },     // Mint
            { bg: 'rgba(255, 192, 203, 0.25)', border: '#ffc0cb', text: '#ffc0cb' },    // Pink
            { bg: 'rgba(144, 238, 144, 0.25)', border: '#90ee90', text: '#90ee90' },    // Light Green
            { bg: 'rgba(255, 218, 121, 0.25)', border: '#ffda79', text: '#ffda79' },    // Light Gold
            { bg: 'rgba(135, 206, 250, 0.25)', border: '#87cefa', text: '#87cefa' },    // Sky Blue
            { bg: 'rgba(221, 160, 221, 0.25)', border: '#dda0dd', text: '#dda0dd' },    // Plum
        ];

        // Assign colors in order of first appearance, so distinct labels never collide
        const labelColorAssignments = new Map();

        function getLabelColor(labelName) {
            if (!labelColorAssignments.has(labelName)) {
                const index = labelColorAssignments.size % LABEL_COLOR_PALETTE.length;
                labelColorAssignments.set(labelName, LABEL_COLOR_PALETTE[index]);
            }
            return labelColorAssignments.get(labelName);
        }

        function createCard(issue) {
            const card = document.createElement('div');
            card.className = 'card';
            card.draggable = true;
            card.id = `card-${issue.id}`;

            let metaHtml = '';

            // Urgency badge (most prominent)
            if (issue.urgency === 'urgent') {
                metaHtml += `<span class="badge urgency-urgent">🚨 URGENT</span>`;
            }

            if (issue.agent) {
                metaHtml += `<span class="badge agent">👤 ${issue.agent}</span>`;
            }

            if (issue.due_date_str) {
                const dueDate = new Date(issue.due_date_str);
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                dueDate.setHours(0, 0, 0, 0);

                const daysUntil = Math.ceil((dueDate - today) / (1000 * 60 * 60 * 24));
                let badgeClass = 'badge';

                if (daysUntil < 0) {
                    badgeClass += ' overdue';
                    metaHtml += `<span class="${badgeClass}">⏰ Overdue (${Math.abs(daysUntil)}d)</span>`;
                } else if (daysUntil <= 3) {
                    badgeClass += ' due-soon';
                    metaHtml += `<span class="${badgeClass}">📅 Due in ${daysUntil}d</span>`;
                } else {
                    badgeClass += ' due-soon';
                    metaHtml += `<span class="${badgeClass}">📅 ${issue.due_date_str}</span>`;
                }
            }

            if (issue.priority === 'high' || issue.priority === 'critical') {
                metaHtml += `<span class="badge priority-high">⚡ ${issue.priority}</span>`;
            }

            let labelsHtml = '';
            if (issue.labels && issue.labels.length > 0) {
                labelsHtml = `
                    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0;">
                        ${issue.labels.map(label => {
                            const color = getLabelColor(label);
                            return `
                                <span style="
                                    display: inline-block;
                                    padding: 4px 8px;
                                    background: ${color.bg};
                                    border: 1px solid ${color.border};
                                    border-radius: var(--radius-xs);
                                    font-size: 11px;
                                    color: ${color.text};
                                    white-space: nowrap;
                                    overflow: hidden;
                                    text-overflow: ellipsis;
                                    font-weight: 500;
                                ">${label}</span>
                            `;
                        }).join('')}
                    </div>
                `;
            }

            card.innerHTML = `
                <div class="card-title">#${issue.id} ${issue.title}</div>
                ${labelsHtml}
                <div class="card-meta">${metaHtml}</div>
                <div class="card-footer">
                    <small style="color: var(--text-muted);">Click to view details</small>
                </div>
            `;

            // Drag handlers
            card.addEventListener('dragstart', (e) => {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('issueId', issue.id);
                card.style.opacity = '0.5';
            });

            card.addEventListener('dragend', () => {
                card.style.opacity = '1';
            });

            return card;
        }

        function setupDragAndDrop() {
            const statusMap = {
                'column-todo': 'todo',
                'column-in-progress': 'in-progress',
                'column-ai-active': 'ai-active',
                'column-pending-review': 'pending-review',
                'column-done': 'done'
            };

            Object.values(statusMap).forEach(status => {
                const column = document.getElementById(`column-${status}`);

                column.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    column.style.borderColor = 'var(--accent)';
                    column.style.background = 'rgba(62, 207, 142, 0.05)';
                });

                column.addEventListener('dragleave', (e) => {
                    if (e.target === column) {
                        column.style.borderColor = 'var(--glass-border)';
                        column.style.background = 'var(--surface-raised)';
                    }
                });

                column.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    column.style.borderColor = 'var(--glass-border)';
                    column.style.background = 'var(--surface-raised)';

                    const issueId = e.dataTransfer.getData('issueId');

                    // Find the new status
                    const newStatus = Object.entries(statusMap).find(([colId, s]) => {
                        return colId === column.id.replace('column-', 'column-');
                    });

                    if (newStatus) {
                        await updateIssueStatus(issueId, statusMap[column.id]);
                    }
                });
            });
        }

        async function updateIssueStatus(issueId, newStatus) {
            try {
                const response = await fetch(`${API_BASE}/api/issues/${issueId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });

                if (response.ok) {
                    // Reload issues to get fresh data
                    await loadIssues();
                } else {
                    showError('Failed to update issue status');
                }
            } catch (error) {
                showError(`Error updating issue: ${error.message}`);
            }
        }

        function showError(message) {
            const errorContainer = document.getElementById('error-container');
            errorContainer.innerHTML = `<div class="error">${message}</div>`;
        }

        function updateSyncStatus(status) {
            document.getElementById('sync-status').textContent = status;
        }

        // Event listeners
        document.getElementById('search-input').addEventListener('input', () => {
            renderBoard();
        });

        document.getElementById('urgency-filter').addEventListener('change', () => {
            renderBoard();
        });

        document.getElementById('date-from-filter').addEventListener('change', () => {
            renderBoard();
        });

        document.getElementById('date-to-filter').addEventListener('change', () => {
            renderBoard();
        });

        // Quick filter buttons
        function setQuickDateFilter(days = null) {
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const todayStr = today.toISOString().split('T')[0];

            const dateFromInput = document.getElementById('date-from-filter');
            const dateToInput = document.getElementById('date-to-filter');

            if (days === null) {
                // Clear filters
                dateFromInput.value = '';
                dateToInput.value = '';
            } else {
                // Set from today
                dateFromInput.value = todayStr;

                // Set to date
                const toDate = new Date(today);
                toDate.setDate(toDate.getDate() + days);
                dateToInput.value = toDate.toISOString().split('T')[0];
            }

            renderBoard();
        }

        document.getElementById('due-today-btn').addEventListener('click', () => {
            setQuickDateFilter(0);  // Today only
            updateQuickFilterButtons('due-today-btn');
        });

        document.getElementById('due-week-btn').addEventListener('click', () => {
            setQuickDateFilter(7);  // This week (7 days)
            updateQuickFilterButtons('due-week-btn');
        });

        function updateQuickFilterButtons(activeBtn) {
            document.getElementById('due-today-btn').classList.remove('active');
            document.getElementById('due-week-btn').classList.remove('active');
            if (activeBtn) {
                document.getElementById(activeBtn).classList.add('active');
            }
        }

        // Clear active button when manually changing date filters
        document.getElementById('date-from-filter').addEventListener('change', () => {
            updateQuickFilterButtons(null);
            renderBoard();
        });

        document.getElementById('date-to-filter').addEventListener('change', () => {
            updateQuickFilterButtons(null);
            renderBoard();
        });

        // Auto-refresh functionality
        const REFRESH_INTERVAL = 60000; // 60 seconds
        let refreshCountdown = REFRESH_INTERVAL / 1000;
        let refreshTimerInterval = null;
        let autoRefreshInterval = null;

        function resetRefreshTimer() {
            refreshCountdown = REFRESH_INTERVAL / 1000;
            updateRefreshDisplay();
        }

        function updateRefreshDisplay() {
            const timerEl = document.getElementById('refresh-timer');
            if (refreshCountdown > 0) {
                timerEl.textContent = `Auto in ${refreshCountdown}s`;
            }
        }

        function startAutoRefreshTimer() {
            if (refreshTimerInterval) clearInterval(refreshTimerInterval);
            refreshTimerInterval = setInterval(() => {
                refreshCountdown--;
                updateRefreshDisplay();
                if (refreshCountdown <= 0) {
                    loadIssues();
                    resetRefreshTimer();
                }
            }, 1000);
        }

        // Manual refresh button
        document.getElementById('refresh-btn').addEventListener('click', () => {
            loadIssues();
            resetRefreshTimer();
        });

        // Clear filters button
        document.getElementById('clear-filters-btn').addEventListener('click', () => {
            document.getElementById('search-input').value = '';
            document.getElementById('urgency-filter').value = '';
            document.getElementById('date-from-filter').value = '';
            document.getElementById('date-to-filter').value = '';
            updateQuickFilterButtons(null);
            loadIssues();
        });

        // Toggle done column button
        let isDoneHidden = false;
        document.getElementById('toggle-done-btn').addEventListener('click', function() {
            isDoneHidden = !isDoneHidden;
            const doneColumn = document.querySelector('.column.done');
            const kanban = document.getElementById('kanban');

            if (isDoneHidden) {
                doneColumn.style.display = 'none';
                kanban.style.gridTemplateColumns = 'repeat(4, 1fr)';
                this.textContent = '👁️ Show Done';
                this.style.background = 'var(--accent)';
                this.style.borderColor = 'var(--accent)';
                this.style.color = 'white';
            } else {
                doneColumn.style.display = 'flex';
                kanban.style.gridTemplateColumns = 'repeat(5, 1fr)';
                this.textContent = '👁️ Hide Done';
                this.style.background = 'var(--glass-bg)';
                this.style.borderColor = 'var(--glass-border)';
                this.style.color = 'var(--text-secondary)';
            }
        });

        // Drawer functions
        let currentIssueId = null;

        async function postComment() {
            const commentText = document.getElementById('comment-textarea').value.trim();
            if (!commentText) {
                alert('Please enter a comment');
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/issues/${currentIssueId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: commentText })
                });

                const data = await response.json();
                if (!data.success) {
                    alert('Failed to post comment: ' + data.error);
                    return;
                }

                // Clear input
                document.getElementById('comment-textarea').value = '';

                // Reload issue details to show new comment
                await loadIssueDetails(currentIssueId);
            } catch (error) {
                alert('Error posting comment: ' + error.message);
            }
        }

        async function dispatchIssue() {
            const agentSelect = document.getElementById('dispatch-agent');
            const agentName = agentSelect.value;

            if (!agentName) {
                alert('Please select an agent');
                return;
            }

            try {
                // Post instruction comment to the agent
                const instructionComment = `@${agentName} - This issue has been dispatched to you.\n\n**Your Task:** Complete the work described in this issue.\n\n**Important:** Please keep this GitHub issue updated throughout your work:\n- Post progress updates as comments\n- Update labels and status as needed\n- Report findings, errors, and solutions\n- This issue is the source of truth for tracking your progress\n\nWhen complete, the issue will be moved to Pending Review for approval.`;

                const commentResponse = await fetch(`${API_BASE}/api/issues/${currentIssueId}/comment`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: instructionComment })
                });

                const response = await fetch(`${API_BASE}/api/issues/${currentIssueId}/dispatch`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ agent: agentName })
                });

                const data = await response.json();
                if (!data.success) {
                    alert('Failed to dispatch: ' + data.error);
                    return;
                }

                // Update issue status to ai-active
                const statusResponse = await fetch(`${API_BASE}/api/issues/${currentIssueId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'ai-active' })
                });

                if (statusResponse.ok) {
                    alert(`✅ Dispatched to ${agentName}\n\nThe issue is now marked as AI Active.\nThe agent will read the issue and take action based on the description and latest comment.`);
                    agentSelect.value = '';  // Reset dropdown
                    closeDrawer();
                    await loadIssues();  // Fetch fresh data so card appears in AI-ACTIVE column
                } else {
                    alert('✅ Dispatch submitted, but failed to update status. Please refresh.');
                    await loadIssues();  // Still refresh so any partial change is visible
                }
            } catch (error) {
                alert('Error dispatching: ' + error.message);
            }
        }

        async function loadIssueDetails(issueId) {
            currentIssueId = issueId;
            try {
                const response = await fetch(`${API_BASE}/api/issues/${issueId}/details`);
                const data = await response.json();

                if (!data.success) {
                    alert('Failed to load issue details');
                    return;
                }

                const issue = data.issue;

                // Populate drawer
                document.getElementById('drawer-title').innerHTML = `<a href="${issue.url}" target="_blank" style="color: var(--accent); text-decoration: none; cursor: pointer;">##${issue.id}</a> ${issue.title}`;
                document.getElementById('drawer-issue-number').innerHTML = `<a href="${issue.url}" target="_blank" style="color: var(--accent); text-decoration: none; cursor: pointer; font-weight: 500;">#${issue.id}</a>`;
                document.getElementById('drawer-status').textContent = issue.status.toUpperCase();
                document.getElementById('drawer-priority').textContent = issue.priority || 'normal';
                document.getElementById('drawer-body').textContent = issue.body || '(No description)';

                // Populate agent dropdown
                const agentSelect = document.getElementById('drawer-agent-select');
                agentSelect.value = issue.agent || '';

                // Populate due date input
                const dueInput = document.getElementById('drawer-due-input');
                dueInput.value = issue.due_date_str || '';

                // Populate labels select
                const labelsSelect = document.getElementById('drawer-labels-select');
                labelsSelect.innerHTML = '';
                // Get all unique labels from all issues
                const allLabels = new Set();
                allIssues.forEach(i => {
                    if (i.labels) {
                        i.labels.forEach(label => allLabels.add(label));
                    }
                });
                Array.from(allLabels).sort().forEach(label => {
                    const option = document.createElement('option');
                    option.value = label;
                    option.textContent = label;
                    if (issue.labels && issue.labels.includes(label)) {
                        option.selected = true;
                    }
                    labelsSelect.appendChild(option);
                });

                // Add event listeners to metadata selects
                agentSelect.addEventListener('change', (e) => {
                    updateIssueMetadata(issue.id, 'agent', e.target.value);
                });

                dueInput.addEventListener('change', (e) => {
                    updateIssueMetadata(issue.id, 'due_date', e.target.value);
                });

                labelsSelect.addEventListener('change', (e) => {
                    const selectedLabels = Array.from(labelsSelect.selectedOptions).map(opt => opt.value);
                    updateIssueMetadata(issue.id, 'labels', selectedLabels);
                });

                // Populate comments
                const commentsList = document.getElementById('comments-list');
                commentsList.innerHTML = '';
                document.getElementById('comment-count').textContent = issue.comments.length;

                if (issue.comments.length === 0) {
                    commentsList.innerHTML = '<div class="no-comments">No comments yet</div>';
                } else {
                    issue.comments.forEach(comment => {
                        const commentEl = document.createElement('div');
                        commentEl.className = 'comment';

                        const commentDate = new Date(comment.created_at).toLocaleDateString();

                        commentEl.innerHTML = `
                            <div class="comment-avatar">
                                <img src="${comment.avatar}" alt="${comment.author}" />
                            </div>
                            <div class="comment-body">
                                <div>
                                    <span class="comment-author">${comment.author}</span>
                                    <span class="comment-date">${commentDate}</span>
                                </div>
                                <div class="comment-text">${comment.body}</div>
                            </div>
                        `;
                        commentsList.appendChild(commentEl);
                    });
                }

                // Open drawer
                openDrawer();
            } catch (error) {
                console.error('Error loading issue details:', error);
                alert('Error loading issue details');
            }
        }

        function openDrawer() {
            document.getElementById('issue-drawer').classList.add('open');
        }

        function closeDrawer() {
            document.getElementById('issue-drawer').classList.remove('open');
            document.getElementById('comment-textarea').value = '';
            document.getElementById('dispatch-agent').value = '';
            currentIssueId = null;
        }

        async function closeIssue() {
            if (!currentIssueId) return;

            if (!confirm(`Are you sure you want to close issue #${currentIssueId}?`)) {
                return;
            }

            try {
                const response = await fetch(`${API_BASE}/api/issues/${currentIssueId}/close`, {
                    method: 'POST'
                });
                const data = await response.json();

                if (data.success) {
                    closeDrawer();
                    loadIssues();
                } else {
                    alert('Failed to close issue: ' + data.error);
                }
            } catch (error) {
                alert('Error closing issue: ' + error.message);
            }
        }

        async function updateIssueMetadata(issueId, type, value) {
            try {
                const issue = allIssues.find(i => i.id === issueId);
                if (!issue) return;

                let newLabels = [...issue.labels];

                if (type === 'agent') {
                    // Remove old agent label, add new one
                    newLabels = newLabels.filter(l => !l.startsWith('agent:'));
                    if (value) {
                        newLabels.push(`agent:${value}`);
                    }
                } else if (type === 'due_date') {
                    // Remove old due label, add new one
                    newLabels = newLabels.filter(l => !l.startsWith('due:'));
                    if (value) {
                        newLabels.push(`due:${value}`);
                    }
                } else if (type === 'labels') {
                    // Replace labels (excluding status and agent labels)
                    newLabels = newLabels.filter(l => l.startsWith('status:') || l.startsWith('agent:') || l.startsWith('due:') || l.startsWith('priority:'));
                    newLabels.push(...value);
                }

                // Update via API
                const response = await fetch(`${API_BASE}/api/issues/${issueId}/status`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ labels: newLabels })
                });

                if (response.ok) {
                    loadIssues();
                }
            } catch (error) {
                console.error('Error updating metadata:', error);
            }
        }

        // Drawer event listeners
        document.getElementById('drawer-close').addEventListener('click', closeDrawer);
        document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);
        document.getElementById('post-comment-btn').addEventListener('click', postComment);
        document.getElementById('dispatch-btn').addEventListener('click', dispatchIssue);
        document.getElementById('close-issue-btn').addEventListener('click', closeIssue);

        async function populateDispatchAgentDropdown() {
            try {
                const response = await fetch(`${API_BASE}/api/config`);
                const data = await response.json();
                const agentSelect = document.getElementById('dispatch-agent');

                if (data.default_agents && data.default_agents.length > 0) {
                    data.default_agents.forEach(agent => {
                        const option = document.createElement('option');
                        option.value = agent;
                        option.textContent = agent.charAt(0).toUpperCase() + agent.slice(1);
                        agentSelect.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Error loading agents:', error);
            }
        }

        // Add click handlers to cards in renderBoard
        const originalRenderBoard = renderBoard;
        renderBoard = function() {
            originalRenderBoard();

            // Add click handlers to cards
            document.querySelectorAll('.card').forEach(card => {
                card.style.cursor = 'pointer';
                card.addEventListener('click', (e) => {
                    if (e.target.tagName !== 'A') {  // Don't open drawer on GitHub link click
                        const issueId = card.id.replace('card-', '');
                        loadIssueDetails(issueId);
                    }
                });
            });
        };

        // Initial load
        loadIssues();
        populateDispatchAgentDropdown();
        startAutoRefreshTimer();

        // Setup drag and drop after initial render
        setTimeout(setupDragAndDrop, 500);
    </script>
</body>
</html>
